name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -X POST \
            'https://jhheiwjxpajzbixdubmx.supabase.co/rest/v1/rpc/list_coupons' \
            -H 'Content-Type: application/json' \
            -H 'apikey: sb_publishable_ruWZ311nRp_rPXZAu_yXPA_dyg-JOc5' \
            -H 'Authorization: Bearer sb_publishable_ruWZ311nRp_rPXZAu_yXPA_dyg-JOc5' \
            -d '{}' \
            --fail-with-body
          echo "Supabase pinged successfully"
